name: Build and push image
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches:
      - master
concurrency:
  group: image
  cancel-in-progress: false
jobs:
  # Build, test, and push a :candidate image to GHCR
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      # Scheduled runs only build when Docker Hub has no tag for the latest AMX Mod X release
      - name: Detect version
        id: version
        run: |
          version=$(./latest-version.sh)
          [ -n "$version" ]
          echo "version=$version" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "schedule" ] && curl -fs "https://hub.docker.com/v2/repositories/stevenlafl/amxmodx-ci/tags/$version" > /dev/null; then
            echo "Tag $version already pushed"
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "build=true" >> $GITHUB_OUTPUT
          fi
      - name: Build
        if: steps.version.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/stevenlafl/amxmodx-ci:candidate
      - name: Test
        if: steps.version.outputs.build == 'true'
        run: tests/run.sh ghcr.io/stevenlafl/amxmodx-ci:candidate
      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push candidate
        if: steps.version.outputs.build == 'true'
        run: docker push ghcr.io/stevenlafl/amxmodx-ci:candidate

  # Callers like hrpv2 run their steps inside the image (container:), so check
  # that GitHub's JavaScript actions work in it before it becomes :latest
  container-job:
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/stevenlafl/amxmodx-ci:candidate
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - run: cd tests/fixtures/flat && compile.sh && ls compiled/a.amxx
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: container-job
          path: tests/fixtures/flat/compiled

  publish:
    needs: [build, container-job]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push
        run: |
          docker pull ghcr.io/stevenlafl/amxmodx-ci:candidate
          for tag in ghcr.io/stevenlafl/amxmodx-ci:${{ needs.build.outputs.version }} ghcr.io/stevenlafl/amxmodx-ci:latest \
                     stevenlafl/amxmodx-ci:${{ needs.build.outputs.version }} stevenlafl/amxmodx-ci:latest; do
            docker tag ghcr.io/stevenlafl/amxmodx-ci:candidate $tag
            docker push $tag
          done
